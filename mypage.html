<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>勤怠ページ</title>
<!-- 勤怠ページ：職員が自分の打刻を見て修正を申請する／部門長が了承する／事務局が反映する（設計書 10_勤怠ページ_設計_R8.11.md） -->
<style>
:root{
  --bg:#f3f6f5; --card:#fff; --ink:#1f2d2b; --sub:#5d6f6c; --line:#dde5e3;
  --main:#1f7a6d; --main-d:#155e54; --main-l:#e3f2ef;
  --red:#c8412f; --red-l:#fdecea; --yel:#a86b00; --yel-l:#fff4d6; --org-l:#fff0e3; --blue:#2c62a8; --blue-l:#e6eefa; --gray-l:#eef1f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.6}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
.wrap.wide{max-width:1100px}
header.app{background:var(--main);color:#fff;padding:12px 16px}
header.app .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.app.wide .in{max-width:1100px}
header.app .who{flex:1;line-height:1.3}
header.app .who small{display:block;opacity:.85;font-size:12px}
header.app .out{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
.note-idle{font-size:12px;color:var(--sub);text-align:center;margin:12px 0 0}
.tabs{display:flex;gap:4px;margin:16px 0 12px;background:var(--gray-l);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;color:var(--sub);font-weight:bold;font-size:15px}
.tabs button.on{background:#fff;color:var(--main-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;line-height:20px;margin-left:4px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.alert{display:flex;gap:12px;align-items:center;background:var(--red-l);border:1px solid #f3c2bb;color:var(--red);border-radius:14px;padding:14px 16px;margin:16px 0 0;font-weight:bold}
.alert.ok{background:var(--main-l);border-color:#bfe0d9;color:var(--main-d)}
.alert.info{background:var(--blue-l);border-color:#c5d6ef;color:var(--blue);font-weight:normal}
.alert .ico{font-size:24px}
.month{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.month h2{margin:0;font-size:20px}
.month button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--sub)}
.month button:disabled{opacity:.35}
.days{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.day{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:58px}
.day:last-child{border-bottom:0}
.day .d{font-weight:bold;font-size:17px;line-height:1.2}
.day .d small{display:block;font-weight:normal;font-size:12px;color:var(--sub)}
.day.sun .d,.day.sun .d small{color:var(--red)}
.day.sat .d,.day.sat .d small{color:var(--blue)}
.day .t{display:flex;gap:4px 14px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.day .t span{white-space:nowrap}
.day .t i{font-style:normal;font-size:12px;color:var(--sub);margin-right:4px}
.day .t .miss{color:var(--red);font-weight:bold}
.day .t .hint{font-size:13px;color:var(--yel)}
.day.blank .t{color:var(--sub)}
.day.miss{background:var(--red-l)}
.day.none{background:var(--org-l)}
.day.wait{background:var(--yel-l)}
.day.today{outline:2px solid var(--main);outline-offset:-2px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:bold}
.btn.fix{background:var(--red);color:#fff;padding:8px 14px}
.btn.lite{background:var(--gray-l);color:var(--sub);padding:8px 12px;font-size:14px}
.btn.main{background:var(--main);color:#fff}
.btn.main:disabled{background:#a9c4bf}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.out:disabled{opacity:.4}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:12px}
.btn.ng{background:#fff;color:var(--red);border:1px solid #f0b8b0}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:bold;white-space:nowrap}
.tag.wait{background:var(--yel-l);color:var(--yel)}
.tag.app{background:var(--blue-l);color:var(--blue)}
.tag.done{background:var(--main-l);color:var(--main-d)}
.tag.back,.tag.err{background:var(--red-l);color:var(--red)}
.tag.drop{background:var(--gray-l);color:var(--sub)}
.ttl{font-size:18px;font-weight:bold;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px}
.chg{font-size:18px;font-weight:bold;font-variant-numeric:tabular-nums;margin:6px 0}
.chg s{color:var(--sub);font-weight:normal}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.steps{display:flex;margin:12px 0 4px;font-size:12px;color:var(--sub)}
.steps div{flex:1;text-align:center;position:relative;padding-top:20px}
.steps div:before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#cfd8d6;z-index:1}
.steps div:after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:#cfd8d6}
.steps div:first-child:after{display:none}
.steps div.on{color:var(--main-d);font-weight:bold}
.steps div.on:before,.steps div.on:after{background:var(--main)}
.steps div.ng{color:var(--red);font-weight:bold}
.steps div.ng:before{background:var(--red)}
.cmt{background:var(--red-l);border-radius:8px;padding:8px 10px;color:var(--red);font-size:14px;margin-top:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px 24px}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:20px}
.lbl{font-weight:bold;margin:18px 0 8px;display:block}
.lbl small{font-weight:normal;color:var(--sub);margin-left:6px}
.now{background:var(--gray-l);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;font-weight:bold;text-align:center}
.choices button small{display:block;font-weight:normal;font-size:12px;color:var(--sub)}
.choices button.on{border-color:var(--main);background:var(--main-l);color:var(--main-d)}
.choices button:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px}
.chips button.on{border-color:var(--main);background:var(--main-l);color:var(--main-d);font-weight:bold}
input.time{font-size:28px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:100%;font-variant-numeric:tabular-nums;font-family:inherit;background:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair small{display:block;color:var(--sub);font-size:13px;margin-bottom:4px}
.next{color:var(--yel);font-weight:bold;font-size:14px;margin-top:6px;min-height:1em}
textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:16px;min-height:64px}
select{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;max-width:100%}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.login{max-width:380px;margin:32px auto;padding:0 16px 40px}
.login h1{font-size:22px;text-align:center;margin:0 0 4px}
.field{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:26px;letter-spacing:4px;text-align:center;min-height:60px;font-variant-numeric:tabular-nums}
.field.focus{border-color:var(--main)}
.field .ph{letter-spacing:0;font-size:16px;color:var(--sub)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pad button{background:#fff;border:1px solid var(--line);border-radius:12px;font-size:24px;padding:14px 0;font-weight:bold;color:var(--ink)}
.pad button:active{background:var(--main-l)}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0 16px;font-size:15px}
.chk input{width:22px;height:22px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:15px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--gray-l);font-size:13px;color:var(--sub);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sel td{background:var(--main-l)}
td input[type=checkbox],th input[type=checkbox]{width:20px;height:20px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;margin-top:12px;border-radius:12px;box-shadow:0 -2px 8px rgba(0,0,0,.06);flex-wrap:wrap}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263432;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,28,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%}
.modal h3{margin:0 0 8px}
.modal .row{justify-content:flex-end;margin-top:16px}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:50;font-weight:bold;color:var(--main-d)}
.busy.show{display:flex}
@media(max-width:700px){.hide-sp{display:none}table{font-size:14px}th,td{padding:8px 6px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy">読み込み中…</div>

<script src="config.js"></script>
<script>
// ================================================================ 共通
const RELOGIN = 'ログインの有効時間が切れました。もう一度ログインしてください';
const IDLE_MS = 3 * 60 * 1000;   // 共用の端末：3分さわらないとログアウト
const DEVICE_KEY = 'mypage_device';
const WD = ['日','月','火','水','木','金','土'];
const KINDS = [
  { k:'出勤を追加', s:'出勤の打刻がない' }, { k:'退勤を追加', s:'退勤の打刻がない' },
  { k:'出勤と退勤を追加', s:'その日の打刻がまったくない', wide:true },
  { k:'出勤を直す', s:'時刻がちがう' }, { k:'退勤を直す', s:'時刻がちがう' },
  { k:'打刻を取り消す', s:'押し間違いを消す', wide:true },
];
const REASONS = ['打ち忘れ','時刻の誤り','押し間違い','機器の不具合','その他'];
const ST = { WAIT:'了承待ち', APP:'反映待ち', DONE:'反映済み', BACK:'差し戻し', DROP:'取り下げ', ERR:'エラー' };

let S = { token:'', me:null, mustChange:false, device:'', tab:'', ym:'', month:null, reqs:null, boss:null, office:null, sel:new Set(), viewNo:'', viewYm:'', viewMonth:null };
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200); }
function dlabel(key){ const [y,m,d]=key.split('-').map(Number); return `${m}/${d}（${WD[new Date(y,m-1,d).getDay()]}）`; }
function ymOf(d){ return `${d.getFullYear()}-${d.getMonth()+1}`; }
function ymShift(ym, n){ const [y,m]=ym.split('-').map(Number); return ymOf(new Date(y, m-1+n, 1)); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return `${y}年${Number(m)}月`; }
function hmMin(t){ const m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60+Number(m[2]) : -1; }
function hmText(t){ const v=hmMin(t); return v<0 ? '' : `${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`; }

async function api(action, payload, quiet){
  if (!quiet) $('#busy').classList.add('show');
  try {
    return await window.kintaiApi(action, Object.assign({ token:S.token }, payload||{}));
  } catch (e) {
    if (e.message === RELOGIN) { forget(false); renderLogin(RELOGIN); throw new Error('relogin'); }
    throw e;
  } finally { $('#busy').classList.remove('show'); }
}
function fail(e, where){ if (e.message === 'relogin') return; if (where) where.textContent = e.message; else toast(e.message); }

// 共用の端末は3分さわらないとログアウト（「この端末を記憶」したスマホは除く）
let lastAct = Date.now();
['pointerdown','keydown','touchstart','scroll'].forEach(ev => addEventListener(ev, () => lastAct = Date.now(), { passive:true }));
setInterval(() => { if (S.token && !S.device && Date.now() - lastAct > IDLE_MS) logout('3分間操作がなかったため、ログアウトしました'); }, 10000);

function forget(all){
  S = Object.assign(S, { token:'', me:null, mustChange:false, month:null, reqs:null, boss:null, office:null, viewMonth:null });
  S.sel = new Set();
  if (all) { S.device=''; window.kintaiStore.remove(DEVICE_KEY); }
  closeSheet(); closeModal();
}
async function logout(msg){
  const token=S.token, device=S.device;
  forget(true);
  renderLogin();
  if (msg) toast(msg);
  try { await window.kintaiApi('myLogout', { token, device }); } catch (e) { /* ログアウトは画面側で完了している */ }
}

// ================================================================ ログイン
let lg = { no:'', pin:'', focus:'no', err:'' };
function renderLogin(err){
  if (err !== undefined) lg.err = err;
  $('#app').innerHTML = `
  <div class="login">
    <div style="text-align:center;font-size:40px;margin-top:8px">🕘</div>
    <h1>勤怠ページ</h1>
    <p class="sub" style="text-align:center;margin:0 0 20px">打刻の確認・修正の申請</p>
    <label class="lbl">職員番号</label>
    <div class="field ${lg.focus==='no'?'focus':''}" data-f="no">${esc(lg.no)||'<span class="ph">タップして入力</span>'}</div>
    <label class="lbl">暗証番号</label>
    <div class="field ${lg.focus==='pin'?'focus':''}" data-f="pin">${'●'.repeat(lg.pin.length)||'<span class="ph">タップして入力</span>'}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="c" style="font-size:16px">消す</button><button data-k="0">0</button><button data-k="b" style="font-size:16px">← 1字</button></div>
    <label class="chk"><input type="checkbox" id="remember"> この端末を記憶する（自分のスマホだけ）</label>
    <button class="btn main big" id="doLogin">ログイン</button>
    <div class="err" id="lerr">${esc(lg.err)}</div>
    <p class="note-idle">共用のパソコン・タブレットでは、3分さわらないと自動でログアウトします。<br>暗証番号を忘れたときは、事務局に申し出てください。</p>
  </div>`;
  $$('.field').forEach(f => f.onclick = () => { lg.focus=f.dataset.f; renderLogin(); });
  $$('.pad button').forEach(b => b.onclick = () => padKey(b.dataset.k));
  $('#doLogin').onclick = doLogin;
}
function padKey(k){
  const f = lg.focus;
  if (k==='c') lg[f]=''; else if (k==='b') lg[f]=lg[f].slice(0,-1);
  else if (f==='pin') { if (lg.pin.length<6) lg.pin+=k; } else if (lg.no.length<8) lg.no+=k;
  const keep = $('#remember') && $('#remember').checked;
  renderLogin(); if (keep) $('#remember').checked = true;
}
addEventListener('keydown', e => {   // パソコンのキーボードでも入力できる
  if (S.token || !$('#doLogin')) return;
  if (/^\d$/.test(e.key)) padKey(e.key);
  else if (e.key==='Backspace') padKey('b');
  else if (e.key==='Tab') { e.preventDefault(); lg.focus = lg.focus==='no'?'pin':'no'; const keep=$('#remember').checked; renderLogin(); $('#remember').checked=keep; }
  else if (e.key==='Enter') doLogin();
});
async function doLogin(){
  if (!lg.no || lg.pin.length<4) { $('#lerr').textContent='職員番号と暗証番号を入れてください'; return; }
  const remember = $('#remember').checked;
  try {
    const r = await api('myLogin', { no:lg.no, pin:lg.pin, remember });
    lg = { no:'', pin:'', focus:'no', err:'' };
    signedIn(r, remember);
  } catch (e) { lg.pin=''; renderLogin(e.message === 'relogin' ? undefined : e.message); }
}
function signedIn(r, remember){
  S.token = r.token; S.me = r.me; S.mustChange = !!r.mustChange;
  if (r.device) { S.device = r.device; window.kintaiStore.set(DEVICE_KEY, r.device); }
  S.pendingRemember = !!remember;
  lastAct = Date.now();
  if (S.mustChange) return renderChangePin();
  start();
}

// ---------------------------------------------------------------- 暗証番号の変更
function renderChangePin(){
  const need = S.me.role === '職員' ? 4 : 6;
  $('#app').innerHTML = `
  <div class="login">
    <h1>暗証番号を決めてください</h1>
    <p class="sub" style="text-align:center">${esc(S.me.name)} さん。仮の番号から、自分だけの<b>${need}桁</b>の番号に変えます。<br>同じ数字の繰り返し・連番・誕生年などは使えません。</p>
    <label class="lbl">新しい暗証番号（${need}桁）</label>
    <input class="time" id="p1" type="password" inputmode="numeric" maxlength="${need}" autocomplete="new-password" style="text-align:center;letter-spacing:6px">
    <label class="lbl">もう一度</label>
    <input class="time" id="p2" type="password" inputmode="numeric" maxlength="${need}" autocomplete="new-password" style="text-align:center;letter-spacing:6px">
    <label class="chk" style="margin-top:16px"><input type="checkbox" id="remember2" ${S.pendingRemember?'checked':''}> この端末を記憶する（自分のスマホだけ）</label>
    <button class="btn main big" id="doChange">この番号にする</button>
    <div class="err" id="cerr"></div>
    <p class="note-idle"><a href="#" id="cancelChange">ログアウト</a></p>
  </div>`;
  $('#p1').focus();
  $('#cancelChange').onclick = e => { e.preventDefault(); logout(); };
  $('#doChange').onclick = async () => {
    const a = $('#p1').value.trim(), b = $('#p2').value.trim();
    if (!new RegExp(`^\\d{${need}}$`).test(a)) return $('#cerr').textContent = `${need}桁の数字で入れてください`;
    if (a !== b) return $('#cerr').textContent = '2回の入力が合いません';
    try {
      const r = await api('myChangePin', { pin:a, remember:$('#remember2').checked });
      if (r.device) { S.device = r.device; window.kintaiStore.set(DEVICE_KEY, r.device); }
      S.mustChange = false; toast('暗証番号を変えました'); start();
    } catch (e) { fail(e, $('#cerr')); }
  };
}

// ================================================================ ログイン後
const TABS = {
  '職員': [['mine','わたしの打刻'],['req','申請の状況']],
  '部門長': [['q','了承待ち'],['miss','部署の打刻漏れ'],['mine','自分の打刻'],['req','自分の申請']],
  '事務局': [['apply','反映待ち'],['waiting','差し戻し'],['done','反映済み'],['staff','職員の打刻'],['mine','自分の打刻'],['req','自分の申請']],
};
function start(){ S.tab = TABS[S.me.role][0][0]; S.ym = ymOf(new Date()); load(); }
function isWide(){ return S.me.role === '事務局' && ['apply','waiting','done'].includes(S.tab); }

async function load(){
  try {
    if (S.tab==='mine') S.month = (await api('myMonth', { ym:S.ym })) ;
    else if (S.tab==='req') S.reqs = (await api('myRequests')).requests;
    else if (S.tab==='q' || S.tab==='miss') S.boss = await api('bossList');
    else if (['apply','waiting','done','staff'].includes(S.tab)) {
      if (!S.office || S.tab!=='staff') S.office = await api('officeList');
      if (S.tab==='staff' && S.viewNo) S.viewMonth = await api('myMonth', { ym:S.viewYm, no:S.viewNo });
    }
    render();
  } catch (e) { fail(e); render(); }
}

function render(){
  if (!S.me) return renderLogin();
  const tabs = TABS[S.me.role];
  const badge = k => k==='q' && S.boss ? S.boss.wait.length : k==='miss' && S.boss ? S.boss.miss.length : k==='apply' && S.office ? S.office.apply.length : 0;
  const roleName = S.me.role;
  $('#app').innerHTML = `
    <header class="app ${isWide()?'wide':''}"><div class="in">
      <div class="who">${esc(S.me.name)} さん<small>${esc(S.me.dept)}　${esc(roleName)}</small></div>
      <button class="out" id="logout">ログアウト</button></div></header>
    <div class="wrap ${isWide()?'wide':''}">
      <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}${badge(k)?`<span class="badge">${badge(k)}</span>`:''}</button>`).join('')}</div>
      <div id="body">${body()}</div>
      ${S.device ? '' : '<p class="note-idle">3分さわらないと自動でログアウトします</p>'}
    </div>`;
  $('#logout').onclick = () => logout('ログアウトしました');
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab=b.dataset.tab; S.sel=new Set(); load(); });
  bind();
}
function body(){
  switch (S.tab) {
    case 'mine': return monthHtml(S.month, true);
    case 'req': return myReqHtml();
    case 'q': return bossQueueHtml();
    case 'miss': return bossMissHtml();
    case 'apply': return officeApplyHtml();
    case 'waiting': return tableHtml(S.office ? S.office.waiting : [], false, '差し戻した申請です（本人が直して出し直すのを待っています。事務局の操作は不要）');
    case 'done': return tableHtml(S.office ? S.office.done : [], false, '反映済みの申請（新しい順・100件まで）');
    case 'staff': return officeStaffHtml();
  }
  return '';
}
function bind(){
  $$('[data-fix]').forEach(b => b.onclick = () => openSheet(b.dataset.fix));
  $$('[data-ym]').forEach(b => b.onclick = () => { if (S.tab==='staff') S.viewYm=b.dataset.ym; else S.ym=b.dataset.ym; load(); });
  $$('[data-withdraw]').forEach(b => b.onclick = () => confirmModal('申請を取り下げます', 'この申請を取り下げます。よろしいですか？', '取り下げる', async () => {
    try { await api('myWithdraw', { id:Number(b.dataset.withdraw) }); toast('取り下げました'); load(); } catch (e) { fail(e); }
  }));
  $$('[data-redo]').forEach(b => b.onclick = async () => { S.tab='mine'; S.ym=ymOf(new Date(b.dataset.redo)); await load(); openSheet(b.dataset.redo); });
  $$('[data-ok]').forEach(b => b.onclick = () => bossDecide([Number(b.dataset.ok)]));
  $$('[data-back]').forEach(b => b.onclick = () => backModal(Number(b.dataset.back), 'boss'));
  $$('[data-sel]').forEach(c => c.onchange = () => { const id=Number(c.dataset.sel); c.checked?S.sel.add(id):S.sel.delete(id); render(); });
  const all = $('#selAll');
  if (all) all.onchange = () => { const list = S.tab==='q' ? S.boss.wait : S.office.apply.filter(r=>r.canApply); list.forEach(r => all.checked?S.sel.add(r.id):S.sel.delete(r.id)); render(); };
  const bulk = $('#bulkOk'); if (bulk) bulk.onclick = () => bossDecide([...S.sel]);
  const ap = $('#applyBtn'); if (ap) ap.onclick = applyModal;
  const ob = $('#officeBack'); if (ob) ob.onclick = () => backModal([...S.sel][0], 'office');
  const vs = $('#viewStaff'); if (vs) vs.onchange = () => { S.viewNo = vs.value; S.viewYm = ymOf(new Date()); S.viewMonth=null; load(); };
}

// ---------------------------------------------------------------- 月の打刻
function monthHtml(m, mine){
  if (!m) return '<div class="card empty">読み込めませんでした。タブを押し直してください</div>';
  const miss = m.days.filter(d => d.state==='miss' && !d.open.length).length;
  let h = '';
  if (mine) {
    h += miss
      ? `<div class="alert"><span class="ico">⚠</span><div>打刻のない日が <span style="font-size:20px">${miss}</span> 日あります<br><span style="font-weight:normal;font-size:14px">赤い日の「直す」から申請してください</span></div></div>`
      : `<div class="alert ok"><span class="ico">✓</span><div>${ymLabel(m.ym)}の打刻漏れはありません</div></div>`;
    if (!m.canRequest) h += `<div class="alert info"><span class="ico">ℹ</span><div>この月は締め日（翌月${m.closeDay}日）を過ぎたため、見るだけです。直したいときは事務局に申し出てください</div></div>`;
  }
  const cur = ymOf(new Date());
  const minYm = mine ? ymShift(cur, -1) : ymShift(cur, -12);
  h += `<div class="month"><button data-ym="${ymShift(m.ym,-1)}" ${cmpYm(ymShift(m.ym,-1),minYm)<0 ? 'disabled':''}>‹ 前の月</button>
    <h2>${ymLabel(m.ym)}</h2><button data-ym="${ymShift(m.ym,1)}" ${cmpYm(m.ym,cur)>=0?'disabled':''}>次の月 ›</button></div>`;
  if (!m.days.length) return h + '<div class="card empty">この月の記録はありません</div>';
  h += '<div class="days">';
  const today = new Date(); const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  m.days.slice().reverse().forEach(d => {
    const w = WD.indexOf(d.dow);
    const cls = ['day', w===0?'sun':w===6?'sat':'', d.date===todayKey?'today':''];
    let t = '';
    if (!d.sessions.length) t = d.state==='none' ? `<span class="hint">打刻がありません（休みの日ならそのままで大丈夫です）</span>` : '<span>—</span>';
    else t = d.sessions.map(s => `<span><i>出勤</i>${s.inText || '<span class="miss">なし</span>'}</span><span><i>退勤</i>${s.outText || (d.state==='work' ? '<span class="sub">勤務中</span>' : '<span class="miss">なし</span>')}</span>`).join('');
    let act = '';
    if (d.open.length) { cls.push('wait'); const st=d.open[0].status; act = `<span class="tag ${st===ST.WAIT?'wait':st===ST.ERR?'err':'app'}">${st===ST.WAIT?'了承待ち':st===ST.ERR?'確認中':'反映待ち'}</span>`; }
    else if (d.state==='miss') cls.push('miss');
    else if (d.state==='none') cls.push('none');
    else if (d.state==='blank') cls.push('blank');
    if (mine && m.canRequest && d.state!=='work') {
      const strong = d.state==='miss' && !d.open.length;
      act += `<button class="btn ${strong?'fix':'lite'}" data-fix="${d.date}" style="margin-left:6px">直す</button>`;
    }
    h += `<div class="${cls.join(' ')}"><div class="d">${Number(d.date.slice(5,7))}/${Number(d.date.slice(8))}<small>${d.dow}曜</small></div><div class="t">${t}</div><div>${act}</div></div>`;
  });
  return h + '</div>';
}
function cmpYm(a,b){ const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return ay!==by ? ay-by : am-bm; }

// ---------------------------------------------------------------- 申請の画面
let F = null;
function openSheet(date){
  const day = S.month && S.month.days.find(d => d.date===date);
  if (!day) return toast('この日は申請できません');
  const p = punchesOf(day);
  const hasIn = p.some(x=>x.type==='出勤'), hasOut = p.some(x=>x.type==='退勤');
  const missIn = day.sessions.some(s=>!s.in), missOut = day.sessions.some(s=>!s.out);
  let kind = '';
  if (!day.sessions.length) kind = '出勤と退勤を追加';
  else if (missIn) kind = '出勤を追加'; else if (missOut) kind = '退勤を追加';
  F = { day, kind, time:'', outTime:'', target:null, reason: kind ? '打ち忘れ' : '', note:'' };
  if (!hasIn && !hasOut && !kind) F.kind = '出勤と退勤を追加';
  renderSheet(); $('#sheetBg').classList.add('show');
}
function closeSheet(){ $('#sheetBg').classList.remove('show'); }
function punchesOf(day){
  const list = [];
  day.sessions.forEach(s => { if (s.in) list.push({ type:'出勤', t:s.in, text:s.inText }); if (s.out) list.push({ type:'退勤', t:s.out, text:s.outText }); });
  return list;
}
function kindEnabled(k, day){
  const p = punchesOf(day);
  const missIn = day.sessions.some(s=>!s.in), missOut = day.sessions.some(s=>!s.out);
  switch (k) {
    case '出勤を追加': return !day.sessions.length || missIn;
    case '退勤を追加': return missOut;
    case '出勤と退勤を追加': return !day.sessions.length;
    case '出勤を直す': return p.some(x=>x.type==='出勤');
    case '退勤を直す': return p.some(x=>x.type==='退勤');
    case '打刻を取り消す': return p.length > 0;
  }
}
function targetsOf(){
  const p = punchesOf(F.day);
  if (F.kind==='出勤を直す') return p.filter(x=>x.type==='出勤');
  if (F.kind==='退勤を直す') return p.filter(x=>x.type==='退勤');
  if (F.kind==='打刻を取り消す') return p;
  return [];
}
/** 退勤を追加：出勤より早い時刻なら翌日 */
function outNextDay(){
  if (F.kind!=='退勤を追加' || !F.time) return false;
  const s = F.day.sessions.find(x=>x.in && !x.out);
  return !!s && hmMin(F.time) <= hmMin(s.inText);
}
function renderSheet(){
  const d = F.day, f = F;
  const tg = targetsOf();
  if (tg.length===1) f.target = tg[0].t;
  if (!tg.some(x=>x.t===f.target)) f.target = tg.length===1 ? tg[0].t : null;
  const cur = punchesOf(d).map(x=>`${x.type} ${x.text}`).join('　／　') || '<b style="color:var(--red)">打刻なし</b>';
  const needTime = f.kind && f.kind!=='打刻を取り消す';
  const both = f.kind==='出勤と退勤を追加';
  const both2 = both && f.time && f.outTime && hmMin(f.outTime) <= hmMin(f.time);
  $('#sheet').innerHTML = `
    <div class="row"><h3>打刻の修正を申請</h3><span class="sp"></span><button class="btn lite" id="sClose">閉じる</button></div>
    <div class="sub">${S.me.role==='職員' ? '申請すると、部門長に届きます' : '申請すると、事務局に届きます'}</div>
    <label class="lbl">対象の日</label>
    <div class="now"><b>${dlabel(d.date)}</b>　${cur}</div>
    <label class="lbl">どうしますか</label>
    <div class="choices">${KINDS.map(k=>`<button data-kind="${k.k}" class="${f.kind===k.k?'on':''}" ${kindEnabled(k.k,d)?'':'disabled'} ${k.wide?'style="grid-column:1/-1"':''}>${k.k}<small>${k.s}</small></button>`).join('')}</div>
    ${tg.length>1 ? `<label class="lbl">${f.kind==='打刻を取り消す'?'取り消す打刻':'直す打刻'}</label><div class="chips">${tg.map(x=>`<button data-tg="${x.t}" class="${f.target===x.t?'on':''}">${x.type} ${x.text}</button>`).join('')}</div>` : ''}
    ${both ? `<label class="lbl">正しい時刻</label><div class="pair"><div><small>出勤</small><input class="time" type="time" id="sTime" value="${f.time}"></div><div><small>退勤</small><input class="time" type="time" id="sOut" value="${f.outTime}"></div></div><div class="next" id="sNext">${both2?'退勤は翌日として申請します（夜勤）':''}</div>`
      : needTime ? `<label class="lbl">正しい時刻${f.kind.includes('直す')&&f.target?`<small>今は ${esc(tg.find(x=>x.t===f.target).text)}</small>`:''}</label><input class="time" type="time" id="sTime" value="${f.time}"><div class="next" id="sNext">${outNextDay()?'翌日の退勤として申請します（夜勤）':''}</div>` : ''}
    <label class="lbl">理由</label>
    <div class="chips">${REASONS.map(r=>`<button data-rs="${r}" class="${f.reason===r?'on':''}">${r}</button>`).join('')}</div>
    <label class="lbl">ひとこと<small>なくても可</small></label>
    <textarea id="sNote" maxlength="200" placeholder="例：急変対応でそのまま帰宅した">${esc(f.note)}</textarea>
    <div class="err" id="sErr"></div>
    <button class="btn main big" id="sSend" style="margin-top:8px">${S.me.role==='職員' ? '部門長に申請する' : '事務局に申請する'}</button>`;
  $('#sClose').onclick = closeSheet;
  $$('[data-kind]').forEach(b => b.onclick = () => { f.kind=b.dataset.kind; f.time=''; f.outTime=''; f.target=null; if (!f.reason && /追加/.test(f.kind)) f.reason='打ち忘れ'; renderSheet(); });
  $$('[data-tg]').forEach(b => b.onclick = () => { f.target=Number(b.dataset.tg); renderSheet(); });
  $$('[data-rs]').forEach(b => b.onclick = () => { f.reason=b.dataset.rs; renderSheet(); });
  const ti=$('#sTime'), to=$('#sOut');
  const upd = () => { const n=$('#sNext'); if (!n) return; n.textContent = both ? (f.time&&f.outTime&&hmMin(f.outTime)<=hmMin(f.time)?'退勤は翌日として申請します（夜勤）':'') : (outNextDay()?'翌日の退勤として申請します（夜勤）':''); };
  if (ti) ti.oninput = () => { f.time=ti.value; upd(); };
  if (to) to.oninput = () => { f.outTime=to.value; upd(); };
  $('#sNote').oninput = e => f.note = e.target.value;
  $('#sSend').onclick = sendReq;
}
async function sendReq(){
  const f=F, e=$('#sErr');
  if (!f.kind) return e.textContent='「どうしますか」を選んでください';
  if (['出勤を直す','退勤を直す','打刻を取り消す'].includes(f.kind) && !f.target) return e.textContent='対象の打刻を選んでください';
  if (f.kind!=='打刻を取り消す' && !f.time) return e.textContent='正しい時刻を入れてください';
  if (f.kind==='出勤と退勤を追加' && !f.outTime) return e.textContent='退勤の時刻を入れてください';
  if (!f.reason) return e.textContent='理由を選んでください';
  try {
    const r = await api('myRequest', { day:f.day.date, kind:f.kind, time:hmText(f.time), outTime:hmText(f.outTime), nextDay:outNextDay(), target:f.target, reason:f.reason, note:f.note });
    closeSheet();
    toast(r.toOffice ? '事務局に申請しました。「申請の状況」で進み具合がわかります' : '部門長に申請しました。「申請の状況」で進み具合がわかります');
    load();
  } catch (err) { fail(err, e); }
}

// ---------------------------------------------------------------- 申請の状況
function statusTag(s){ return { [ST.WAIT]:'<span class="tag wait">了承待ち</span>', [ST.APP]:'<span class="tag app">反映待ち</span>', [ST.DONE]:'<span class="tag done">反映済み</span>', [ST.BACK]:'<span class="tag back">差し戻し</span>', [ST.DROP]:'<span class="tag drop">取り下げ</span>', [ST.ERR]:'<span class="tag err">事務局で確認中</span>' }[s] || esc(s); }
function chgHtml(r){
  if (r.kind==='打刻を取り消す') return `<s>${esc(r.before)}</s> → 取り消し`;
  if (r.kind==='出勤と退勤を追加') { const [a,b]=String(r.time).split('-'); return `出勤 ${esc(a)} ／ 退勤 ${hmMin(b)<=hmMin(a)?'翌 ':''}${esc(b)}`; }
  const next = r.date && r.day && r.date!==r.day ? '翌 ' : '';
  return r.before ? `<s>${esc(r.before)}</s> → ${next}${esc(r.time)}` : `→ ${next}${esc(r.time)}`;
}
function stepsHtml(r){
  const s=r.status;
  if (s===ST.DROP) return '';
  if (s===ST.BACK) return `<div class="steps"><div class="on">申請</div><div class="ng">差し戻し</div><div>反映</div></div>`;
  return `<div class="steps"><div class="on">申請</div><div class="${s!==ST.WAIT?'on':''}">${r.boss||s===ST.WAIT?'部門長の了承':'事務局の確認'}</div><div class="${s===ST.DONE?'on':''}">事務局で反映</div></div>`;
}
function myReqHtml(){
  const list = S.reqs || [];
  if (!list.length) return '<div class="card empty">申請はまだありません。「わたしの打刻」の「直す」から申請できます</div>';
  return list.map(r => `<div class="card">
    <div class="row"><div class="ttl">${dlabel(r.day)}　${esc(r.kind)}</div><span class="sp"></span>${statusTag(r.status)}</div>
    <div class="chg">${chgHtml(r)}</div>
    <div class="sub">理由：${esc(r.reason)}${r.note?`（${esc(r.note)}）`:''}　申請：${esc(r.at)}</div>
    ${stepsHtml(r)}
    ${r.status===ST.BACK ? `<div class="cmt">差し戻し${r.boss?`（${esc(r.boss)}）`:''}：${esc(r.back)}</div>` : ''}
    <div class="row" style="margin-top:10px"><span class="sp"></span>
      ${r.status===ST.BACK ? `<button class="btn main" data-redo="${esc(r.day)}">内容を直して出し直す</button>` : ''}
      ${r.status===ST.WAIT || (r.status===ST.APP && !r.boss) ? `<button class="btn out" data-withdraw="${r.id}">取り下げる</button>` : ''}
    </div></div>`).join('');
}

// ---------------------------------------------------------------- 部門長
function bossQueueHtml(){
  const q = S.boss ? S.boss.wait : [];
  if (!q.length) return '<div class="card empty">✓ 了承待ちの申請はありません</div>';
  return `<div class="row" style="margin-bottom:8px"><label class="chk" style="margin:0"><input type="checkbox" id="selAll" ${q.every(r=>S.sel.has(r.id))?'checked':''}> すべて選ぶ</label><span class="sp"></span>
      <button class="btn main" id="bulkOk" ${S.sel.size?'':'disabled'}>選んだ ${S.sel.size} 件を了承</button></div>` +
    q.map(r => `<div class="card">
      <div class="row"><input type="checkbox" data-sel="${r.id}" ${S.sel.has(r.id)?'checked':''} style="width:22px;height:22px"><div class="ttl">${esc(r.name)}</div><span class="sub">${esc(r.no)}・${esc(r.dept)}</span><span class="sp"></span><span class="tag wait">了承待ち</span></div>
      <div style="margin-top:6px"><b>${dlabel(r.day)}</b>　${esc(r.kind)}</div>
      <div class="chg">${chgHtml(r)}</div>
      <div class="sub">理由：${esc(r.reason)}${r.note?`（${esc(r.note)}）`:''}</div>
      <div class="row" style="margin-top:12px"><button class="btn ng" data-back="${r.id}">差し戻す</button><span class="sp"></span><button class="btn main" data-ok="${r.id}" style="padding:10px 28px">了承</button></div>
    </div>`).join('');
}
function bossMissHtml(){
  const m = S.boss ? S.boss.miss : [];
  return `<div class="card"><div class="ttl">部署の打刻漏れ（まだ申請がないもの）</div><div class="sub">昨日までの分です。本人に申請をうながしてください</div></div>` +
    (m.length ? m.map(x => `<div class="card"><b>${esc(x.name)}</b> <span class="sub">${esc(x.dept)}</span>　${dlabel(x.day)}<div style="color:var(--red);font-weight:bold">${esc(x.what)}</div></div>`).join('')
      : '<div class="card empty">✓ 申請の出ていない打刻漏れはありません</div>');
}
async function bossDecide(ids){
  if (!ids.length) return;
  try { await api('bossDecide', { ids, decision:'ok' }); S.sel=new Set(); toast(`${ids.length} 件を了承しました。事務局で反映されます`); load(); } catch (e) { fail(e); }
}

// ---------------------------------------------------------------- 事務局
function officeApplyHtml(){
  const q = S.office ? S.office.apply : [];
  if (!q.length) return '<div class="card empty">✓ 反映待ちの申請はありません</div>';
  const can = q.filter(r=>r.canApply);
  return `<p class="sub">部門長が了承した申請と、部門長本人などの申請です。内容を見て、まとめて打刻ログに反映します。「了承待ち」の申請も、事務局が代わりに了承して反映・差し戻しできます。自分の申請はほかの事務局の人が反映します。</p>` +
    tableHtml(q, true) +
    `<div class="bar"><b>${S.sel.size} 件 選択中</b><span class="sp" style="flex:1"></span>
      <button class="btn out" id="officeBack" ${S.sel.size===1?'':'disabled'}>差し戻す</button>
      <button class="btn main" id="applyBtn" ${S.sel.size?'':'disabled'} style="padding:12px 24px">選んだ申請を打刻ログに反映</button></div>`;
}
function tableHtml(list, sel, lead){
  let h = lead ? `<p class="sub">${lead}</p>` : '';
  if (!list.length) return h + '<div class="card empty">ありません</div>';
  const can = list.filter(r=>r.canApply);
  return h + `<table><thead><tr>${sel?`<th><input type="checkbox" id="selAll" ${can.length && can.every(r=>S.sel.has(r.id))?'checked':''}></th>`:''}<th>部署</th><th>氏名</th><th>勤務日</th><th>内容</th><th>時刻</th><th class="hide-sp">理由</th><th class="hide-sp">了承</th><th>状態</th></tr></thead><tbody>` +
    list.map(r => `<tr class="${sel&&S.sel.has(r.id)?'sel':''}">${sel?`<td>${r.canApply?`<input type="checkbox" data-sel="${r.id}" ${S.sel.has(r.id)?'checked':''}>`:'<span class="sub" title="自分の申請">本人</span>'}</td>`:''}
      <td>${esc(r.dept)}</td><td><b>${esc(r.name)}</b><div class="sub">${esc(r.no)}</div></td><td class="num">${dlabel(r.day)}</td><td>${esc(r.kind)}</td>
      <td class="num">${chgHtml(r)}</td><td class="hide-sp">${esc(r.reason)}${r.note?`<div class="sub">${esc(r.note)}</div>`:''}</td>
      <td class="hide-sp">${r.boss?`${esc(r.boss)}<div class="sub">${esc(r.bossAt)}</div>`:'<span class="sub">（事務局へ直接）</span>'}</td>
      <td>${statusTag(r.status)}${r.status===ST.ERR||r.status===ST.DONE?`<div class="sub">${esc(r.memo)}</div>`:''}${r.back?`<div class="sub">${esc(r.back)}</div>`:''}</td></tr>`).join('') + '</tbody></table>';
}
function officeStaffHtml(){
  const list = S.office ? S.office.staff : [];
  let h = `<div class="card row"><b>職員</b><select id="viewStaff"><option value="">選んでください</option>${list.map(s=>`<option value="${esc(s.no)}" ${S.viewNo===s.no?'selected':''}>${esc(s.no)} ${esc(s.name)}（${esc(s.dept)}）</option>`).join('')}</select>
    <span class="sub">見るだけです。直すときは本人の申請か「修正入力」シートで</span></div>`;
  if (S.viewNo && S.viewMonth) h += monthHtml(S.viewMonth, false);
  return h;
}
function applyModal(){
  const n = S.sel.size;
  confirmModal('打刻ログに反映します', `${n} 件の申請を打刻ログに反映します。<br><span class="sub">元の打刻は消さず「取消」の印を付けて残します。反映の前にもう一度チェックし、問題がある申請は反映せず「事務局で確認中」にします。</span>`, '反映する', async () => {
    try {
      const r = await api('officeApply', { ids:[...S.sel] });
      S.sel = new Set();
      toast(`${r.applied} 件を反映しました${r.errors?`（反映できなかった申請 ${r.errors} 件）`:''}${r.checkList===false?'。確認事項の更新はメニューから行ってください':''}`);
      load();
    } catch (e) { fail(e); }
  });
}

// ---------------------------------------------------------------- 確認・差し戻し
function closeModal(){ $('#modalBg').classList.remove('show'); }
function confirmModal(title, html, okLabel, fn){
  $('#modal').innerHTML = `<h3>${esc(title)}</h3><p>${html}</p><div class="row"><button class="btn out" id="mCancel">やめる</button><button class="btn main" id="mOk">${esc(okLabel)}</button></div>`;
  $('#modalBg').classList.add('show');
  $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = () => { closeModal(); fn(); };
}
function backModal(id, who){
  const list = who==='boss' ? S.boss.wait : S.office.apply;
  const r = list.find(x=>x.id===id); if (!r) return;
  $('#modal').innerHTML = `<h3>差し戻す</h3><div class="sub">${esc(r.name)}　${dlabel(r.day)}　${esc(r.kind)}</div>
    <label class="lbl">本人へのひとこと<small>必須</small></label>
    <textarea id="bMsg" maxlength="200" placeholder="例：退勤は18:10ではありませんか？記録を確認してください"></textarea><div class="err" id="bErr"></div>
    <div class="row"><button class="btn out" id="mCancel">やめる</button><button class="btn main" id="mOk" style="background:var(--red)">差し戻す</button></div>`;
  $('#modalBg').classList.add('show');
  $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = async () => {
    const msg = $('#bMsg').value.trim();
    if (!msg) return $('#bErr').textContent = 'ひとことを入れてください';
    try {
      if (who==='boss') await api('bossDecide', { ids:[id], decision:'back', message:msg });
      else await api('officeBack', { id, message:msg });
      S.sel.delete(id); closeModal(); toast('差し戻しました。本人の画面に理由が出ます'); load();
    } catch (e) { fail(e, $('#bErr')); }
  };
}
$('#sheetBg').onclick = e => { if (e.target.id==='sheetBg') closeSheet(); };

// ================================================================ はじめ
(async function boot(){
  const d = window.kintaiStore.get(DEVICE_KEY);
  if (!d) return renderLogin();
  try {
    const r = await window.kintaiApi('myResume', { device:d });
    S.device = d; signedIn(r, true);
  } catch (e) { window.kintaiStore.remove(DEVICE_KEY); renderLogin(); }
})();
</script>
