<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>打刻端末</title>
<link rel="stylesheet" href="style.css">
<style>
  .kiosk { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .kiosk { grid-template-columns: 1fr; } }
  .qrbox { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #qr { background: #fff; padding: 16px; border-radius: 12px; width: 312px; height: 312px; }
  #qr img, #qr canvas { width: 280px !important; height: 280px !important; }
  .big-clock { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .date { font-size: 20px; color: var(--muted); }
  .place { font-size: 26px; font-weight: 700; margin-top: 8px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; width: 280px; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--in); width: 100%; }
  /* 職員カードの読み取り結果（画面いっぱいに大きく表示） */
  .cardpop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .cardpop .box { background: var(--card); border-radius: 18px; padding: 28px 32px; width: min(560px, 92vw); text-align: center; border: 6px solid var(--line); }
  .cardpop .box.in { border-color: var(--in); }
  .cardpop .box.out { border-color: var(--out); }
  .cardpop .box.err { border-color: var(--err); }
  .cardpop .kind { font-size: 56px; font-weight: 700; line-height: 1.15; }
  .cardpop .box.in .kind { color: var(--in); }
  .cardpop .box.out .kind { color: var(--out); }
  .cardpop .box.err .kind { color: var(--err); font-size: 30px; }
  .cardpop .who { font-size: 26px; margin-top: 8px; }
  .cardpop .sub { font-size: 16px; color: var(--muted); margin-top: 8px; }
  .cardpop .undo { margin-top: 18px; font-size: 18px; padding: 12px 28px; background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
</style>
</head>
<body>
<div class="kiosk">
  <div class="card qrbox">
    <div id="qr"></div>
    <div class="bar"><div id="bar"></div></div>
    <p style="font-size:18px;margin:12px 0 0">スマホのカメラで読み取って打刻</p>
    <p class="muted" style="margin:4px 0 0">QRコードは1分ごとに切り替わります</p>
    <div id="k-err"></div>
  </div>

  <div class="card">
    <div class="date" id="k-date"></div>
    <div class="big-clock" id="k-clock">--:--</div>
    <div class="place" id="k-place"></div>

    <div id="k-start">
      <p style="margin-top:20px;font-size:18px">職員カードをお持ちの方は、<strong>QRコードリーダーにかざして</strong>、出勤・退勤を押してください</p>
      <p class="muted" style="margin-top:16px">スマホ・カードをお持ちでない方・登録前の方はこちら</p>
      <button id="k-open" class="b-sub" style="font-size:18px;padding:16px">職員番号とPINで打刻</button>
      <button id="k-signup-open" class="b-sub" style="font-size:16px;padding:14px">はじめての方（登録）</button>
    </div>

    <div id="k-signup" class="hidden" style="margin-top:16px"></div>

    <div id="k-form" class="hidden">
      <label for="k-no">職員番号</label>
      <input id="k-no" inputmode="numeric" autocomplete="off">
      <label for="k-pin">PIN</label>
      <input id="k-pin" type="password" inputmode="numeric" autocomplete="off">
      <div class="btns">
        <button id="k-in" class="b-in primary">出勤</button>
        <button id="k-out" class="b-out primary">退勤</button>
      </div>
      <div id="k-reason" class="hidden">
        <div class="msg warn" id="k-reason-msg"></div>
        <div class="reason" id="k-reason-list"></div>
      </div>
      <div id="k-msg"></div>
      <button id="k-cancel" class="b-sub">やめる</button>
    </div>


    <div id="k-done" class="done hidden" style="margin-top:24px">
      <div class="mark">✓</div>
      <div class="what" id="k-what"></div>
      <div class="muted" id="k-detail"></div>
      <div id="k-warn"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="signup.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.get('key')) kintaiStore.set('kintai_kiosk_key', params.get('key'));
  const key = params.get('key') || kintaiStore.get('kintai_kiosk_key');
  const punchUrl = new URL('punch.html', location.href).href;
  let qr = null, refreshAt = 0, period = 60000, pendingType = null, pendingConfirmed = false, resetTimer = null;

  function msg(el, text, cls) {
    el.innerHTML = '';
    if (!text) return;
    const d = document.createElement('div');
    d.className = 'msg ' + (cls || 'err');
    d.textContent = text;
    el.appendChild(d);
  }

  function tick() {
    const n = new Date();
    $('k-clock').textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0');
    $('k-date').textContent = `${n.getMonth() + 1}月${n.getDate()}日（${'日月火水木金土'[n.getDay()]}）`;
    const left = Math.max(0, refreshAt - Date.now());
    $('bar').style.width = (left / period * 100) + '%';
  }

  async function refreshQr() {
    if (!key) { msg($('k-err'), '端末キーが設定されていません。URLの末尾に ?key=… を付けて開いてください'); return; }
    try {
      const r = await kintaiApi('kioskToken', { key });
      $('k-place').textContent = r.place;
      const text = punchUrl + '?t=' + encodeURIComponent(r.token);
      if (!qr) qr = new QRCode($('qr'), { text, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
      else qr.makeCode(text);
      msg($('k-err'), '');
      if (r.windowMs) period = r.windowMs;
      refreshAt = Date.now() + r.refreshMs;
      setTimeout(refreshQr, r.refreshMs + 300);
    } catch (e) {
      msg($('k-err'), e.message + '（10秒後に再接続します）');
      setTimeout(refreshQr, 10000);
    }
  }

  function openForm() {
    $('k-start').classList.add('hidden');
    $('k-done').classList.add('hidden');
    $('k-form').classList.remove('hidden');
    $('k-no').focus();
    armReset();
  }
  function closeForm() {
    $('k-form').classList.add('hidden');
    $('k-reason').classList.add('hidden');
    $('k-done').classList.add('hidden');
    $('k-signup').classList.add('hidden');
    $('k-signup').innerHTML = '';
    $('k-start').classList.remove('hidden');
    $('k-no').value = $('k-pin').value = '';
    msg($('k-msg'), '');
  }
  // 入力途中で放置されたら60秒で初期画面に戻す（PINの覗き見・入れっぱなし防止）
  function armReset(ms) {
    clearTimeout(resetTimer);
    resetTimer = setTimeout(closeForm, ms || 60000);
  }

  async function punch(type, reason, confirmed) {
    pendingType = type;
    pendingConfirmed = !!confirmed;
    const no = $('k-no').value.trim(), pin = $('k-pin').value.trim();
    if (!no || !pin) { msg($('k-msg'), '職員番号とPINを入力してください'); return; }
    $('k-in').disabled = $('k-out').disabled = true;
    msg($('k-msg'), '');
    armReset();
    try {
      const r = await kintaiApi('kioskPunch', { key, no, pin, type, reason: reason || '', confirm: !!confirmed });
      // 押し間違いの確認（出勤中に出勤、出勤なしで退勤）
      if (r.needConfirm) { if (confirm(r.message)) { await punch(type, reason, true); } return; }
      if (r.needReason) { askReason(r.message); return; }
      $('k-form').classList.add('hidden');
      $('k-reason').classList.add('hidden');
      $('k-what').textContent = `${r.type} ${r.time}`;
      $('k-detail').textContent = r.duplicate ? r.message : `${r.name} さん`;
      msg($('k-warn'), r.warning, 'warn');
      $('k-done').classList.remove('hidden');
      $('k-no').value = $('k-pin').value = '';
      armReset(5000);
    } catch (e) {
      msg($('k-msg'), e.message);
    } finally {
      $('k-in').disabled = $('k-out').disabled = false;
    }
  }

  function askReason(text) {
    $('k-reason-msg').textContent = text;
    const list = $('k-reason-list');
    list.innerHTML = '';
    KINTAI_REASONS.forEach(r => {
      const b = document.createElement('button');
      b.textContent = r;
      b.onclick = () => { $('k-reason').classList.add('hidden'); punch(pendingType, r, pendingConfirmed); };
      list.appendChild(b);
    });
    $('k-reason').classList.remove('hidden');
  }

  // 画面を消灯させない（対応ブラウザのみ）
  async function keepAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { /* 非対応 */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  $('k-open').onclick = openForm;
  // はじめての方の登録：入力に時間がかかるので、放置時の自動リセットは3分にする
  $('k-signup-open').onclick = () => {
    $('k-start').classList.add('hidden');
    $('k-done').classList.add('hidden');
    $('k-signup').classList.remove('hidden');
    armReset(180000);
    KintaiSignup.open($('k-signup'), { key }, {
      phone: false,
      onBack: closeForm,
      onActivity: () => armReset(180000),
      onDone: r => {
        $('k-signup').innerHTML = '';
        $('k-signup').classList.add('hidden');
        $('k-what').textContent = '登録を申請しました';
        $('k-detail').textContent = `${r.name} さん：事務局が承認すると、職員番号と決めたPINで打刻できるようになります`;
        msg($('k-warn'), r.message || '', r.needsCheck ? 'warn' : 'ok');
        $('k-done').classList.remove('hidden');
        armReset(15000);
      },
    });
  };
  $('k-cancel').onclick = closeForm;
  $('k-in').onclick = () => punch('出勤');
  $('k-out').onclick = () => punch('退勤');
  // ---------------------------------------------------------------- 職員カード（QRコードリーダー）
  // リーダーは、読み取った文字をキーボードと同じように素早く送ってくる（最後に Enter）。
  // 入力欄に文字を入れている最中（職員番号・PINなど）は、カードの読み取りとして扱わない
  let cardBuf = '', cardLast = 0, cardTimer = null, popTimer = null;
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const now = Date.now();
    if (now - cardLast > 120) cardBuf = '';
    cardLast = now;
    clearTimeout(cardTimer);
    if (e.key === 'Enter') {
      e.preventDefault();
      if (cardBuf.length >= 8) cardScan(cardBuf);
      cardBuf = '';
      return;
    }
    if (e.key.length === 1) cardBuf += e.key;
    // Enter を送らない設定のリーダー向け：入力が途切れたら読み取り終わりとみなす
    cardTimer = setTimeout(() => { if (/K1[.．。]/i.test(cardBuf.normalize('NFKC'))) cardScan(cardBuf); cardBuf = ''; }, 200);
  });

  function cardPop(cls, html, ms) {
    closeCardPop();
    const d = document.createElement('div');
    d.className = 'cardpop';
    d.id = 'cardpop';
    d.innerHTML = '<div class="box ' + cls + '">' + html + '</div>';
    d.addEventListener('click', ev => { if (ev.target === d) closeCardPop(); });
    document.body.appendChild(d);
    popTimer = setTimeout(closeCardPop, ms || 6000);
    return d;
  }
  function closeCardPop() {
    clearTimeout(popTimer);
    const d = $('cardpop');
    if (d) d.remove();
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // カードを読んだら：名前と「出勤」「退勤」「キャンセル」を出す（押すべきほうを目立たせる）
  async function cardScan(code) {
    cardPop('', '<div class="sub">読み取っています…</div>', 15000);
    try {
      const r = await kintaiApi('kioskCardCheck', { key, card: code });
      const d = cardPop('',
        '<div class="who" style="font-size:30px;font-weight:700">' + esc(r.name) + ' さん</div>' +
        '<div class="sub">' + esc(r.last || '') + '</div>' +
        '<div class="btns" style="margin-top:18px">' +
        '<button class="b-in' + (r.suggested === '出勤' ? ' primary' : '') + '" id="cardin" style="font-size:26px;padding:22px 8px">出勤</button>' +
        '<button class="b-out' + (r.suggested === '退勤' ? ' primary' : '') + '" id="cardout" style="font-size:26px;padding:22px 8px">退勤</button></div>' +
        '<button class="b-sub" id="cardcancel" style="font-size:18px;padding:14px;margin-top:14px">キャンセル</button>', 30000);
      d.querySelector('#cardin').onclick = () => cardPunch(code, '出勤');
      d.querySelector('#cardout').onclick = () => cardPunch(code, '退勤');
      d.querySelector('#cardcancel').onclick = closeCardPop;
    } catch (e) {
      cardPop('err', '<div class="kind">' + esc(e.message) + '</div>', 8000);
    }
  }

  async function cardPunch(code, type, reason, confirmed) {
    cardPop('', '<div class="sub">記録しています…</div>', 15000);
    try {
      const r = await kintaiApi('kioskCard', { key, card: code, type, reason: reason || '', confirm: !!confirmed });
      if (r.needConfirm) {
        closeCardPop();
        if (confirm(r.message)) await cardPunch(code, type, reason, true);
        return;
      }
      if (r.needReason) {
        const d = cardPop(type === '退勤' ? 'out' : 'in',
          '<div class="who">' + esc(r.name) + ' さん（' + esc(type) + '）</div><div class="msg warn">' + esc(r.message) + '</div><div class="reason" id="cardreason"></div>' +
          '<button class="b-sub" id="cardcancel" style="margin-top:12px">キャンセル</button>', 30000);
        KINTAI_REASONS.forEach(x => {
          const b = document.createElement('button');
          b.textContent = x;
          b.onclick = () => cardPunch(code, type, x, confirmed);
          d.querySelector('#cardreason').appendChild(b);
        });
        d.querySelector('#cardcancel').onclick = closeCardPop;
        return;
      }
      const cls = r.type === '退勤' ? 'out' : 'in';
      const d = cardPop(cls,
        '<div class="kind">' + esc(r.type) + ' ' + esc(r.time) + '</div><div class="who">' + esc(r.name) + ' さん</div>' +
        (r.duplicate ? '<div class="sub">' + esc(r.message) + '</div>' : '') +
        (r.warning ? '<div class="msg warn">' + esc(r.warning) + '</div>' : '') +
        (!r.duplicate && r.id ? '<button class="undo" id="cardundo">まちがえた場合は「取り消す」（10秒）</button>' : ''),
        r.duplicate ? 4000 : 10000);
      const u = d.querySelector('#cardundo');
      if (u) u.onclick = async () => {
        u.disabled = true;
        try {
          const x = await kintaiApi('kioskUndo', { key, card: code, id: r.id });
          cardPop('err', '<div class="kind">' + esc(x.message) + '</div><div class="who">' + esc(x.name) + ' さん</div>', 5000);
        } catch (e) {
          cardPop('err', '<div class="kind">' + esc(e.message) + '</div>', 6000);
        }
      };
    } catch (e) {
      cardPop('err', '<div class="kind">' + esc(e.message) + '</div>', 8000);
    }
  }

  setInterval(tick, 250);
  tick();
  keepAwake();
  refreshQr();
})();
</script>
</body>
</html>
